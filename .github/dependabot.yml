version: 2

updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-*'

      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'
      - dependency-name: 'stylelint'
        update-types:
          - 'version-update:semver-major'

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      - dependency-type: direct

  - package-ecosystem: github-actions
    directory: /

    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
