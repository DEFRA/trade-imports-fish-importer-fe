name: Publish

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'ci/**'

concurrency:
  group: $${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_name == 'main' && 1 || 0 }}

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate publishing branch
        id: publish-branch
        run: node scripts/publish-branch.js

      - run: |
          npm ci
          npm run build:frontend
          npm test

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.publish-branch.outputs.prerelease }}
          prerelease-suffix: ${{ steps.publish-branch.outputs.prerelease-suffix }}
          push-dockerhub: ${{ steps.publish-branch.outputs.push-dockerhub }}

#      - name: SonarCloud Scan
