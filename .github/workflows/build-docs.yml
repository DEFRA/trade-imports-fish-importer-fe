name: Deploy documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"

  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install MkDocs
        run: pip install mkdocs-material==9.8.1

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload MkDocs site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
